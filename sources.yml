# Source repos whose skills/ directories are mirrored into this catalog.
# The sync pipeline (scripts/sync.py) clones each, copies SKILL.md files
# under the given namespace, and commits if anything changed.
sources:
  - repo: supabase/agent-skills
    branch: main
    path: skills
    namespace: supabase
  - repo: neondatabase/agent-skills
    branch: main
    path: skills
    namespace: neon
  - repo: vercel-labs/agent-skills
    branch: main
    path: skills
    namespace: vercel
  - repo: nvidia/skills
    branch: main
    path: skills
    namespace: nvidia
  - repo: googleworkspace/cli
    branch: main
    path: skills
    namespace: googleworkspace
    include:
      - gws-shared
      - gws-gmail
      - gws-gmail-triage
      - gws-gmail-read
      - gws-gmail-send
      - gws-gmail-reply
      - gws-gmail-reply-all
      - gws-gmail-forward
      - gws-gmail-watch
      - gws-calendar
      - gws-calendar-agenda
      - gws-calendar-insert
      - gws-workflow-meeting-prep
      - gws-workflow-weekly-digest
