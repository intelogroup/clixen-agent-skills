name: Sync skills from source repos

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run sync
        run: python scripts/sync.py

      - name: Commit changes
        run: |
          git config user.name "skills-sync-bot"
          git config user.email "skills-sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: sync skills from source repos ($(date -u +%Y-%m-%d))"
          git push
